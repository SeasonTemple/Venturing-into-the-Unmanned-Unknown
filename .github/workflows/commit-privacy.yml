name: Commit Privacy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-commit-privacy.py --history
      - run: python scripts/check-commit-privacy.py
      - run: python scripts/check-repository-hygiene.py
      - run: python scripts/check-repository-hygiene.py --history
