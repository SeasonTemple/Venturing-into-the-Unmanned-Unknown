# 把 10 章 SKILL.md 同步为 Astro Starlight 站点（site/）并部署到 GitHub Pages。
#
# 站点地址: https://seasontemple.github.io/Venturing-into-the-Unmanned-Unknown/
#
# 【人工前置动作 · 仓库 owner 必须完成】
#   GitHub Pages 目前未启用。需要 owner 在仓库 Settings → Pages 里，
#   把 Build and deployment 的 Source 选为 "GitHub Actions"。
#   未做此步时 deploy job 会失败（configure-pages 报 Pages 未启用）。这不是 workflow 能代劳的。
#   启用后，首次部署请手动触发一次（Actions → Pages → Run workflow），
#   因为只有改动 skills/**、book.config.json、site/** 或本文件的 push 才会自动触发。
#
# 章节顺序唯一真源是 book.config.json；本 workflow 与 site/ 下的脚本都不含章节列表。
# 子路径部署：site / base 由 configure-pages 的输出注入（SITE_ORIGIN / SITE_BASE），
# 本地与缺省值见 site/site.config.mjs（取自 book.config.json 的 slug）。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "book.config.json"
      - ".github/workflows/pages.yml"
      - "site/**"
  workflow_dispatch:

# 仓库默认权限为 read，下面三项必须显式声明，漏写会导致部署失败。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署；不取消进行中的部署，避免半途中断。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      # 站点「最后更新」取自每个 SKILL.md 的 git 提交日期（site/scripts/sync.mjs），需要完整历史。
      # 浅克隆下 sync.mjs 会降级为不显示日期并 warn（不拿 HEAD 日期冒充），所以这里必须 fetch-depth: 0。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Astro 7 要求 Node >= 22.22.0。
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # 必须在构建之前：输出的 origin / base_path 用于 astro.config.mjs 的 site / base。
      - uses: actions/configure-pages@v5
        id: pages

      - name: Install dependencies
        run: npm ci

      - name: Build site (sync SKILL.md -> Starlight -> Pagefind index)
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # 零改写校验 + 子路径自检：资源/侧栏链接必须带 base，Pagefind 索引必须存在。
      - name: Verify content and base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node scripts/verify-content.mjs
          test -f dist/pagefind/pagefind.js
          grep -q "href=\"${BASE_PATH}/_astro/" dist/index.html
          grep -q "href=\"${BASE_PATH}/ch0/" dist/ch3/index.html
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          test -f dist/chA/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
