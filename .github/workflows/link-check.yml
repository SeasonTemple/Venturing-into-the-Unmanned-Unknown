name: Link Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 仓库内相对链接：--offline 只检查本地文件，失效即失败（真 bug，不容错）。
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check internal links (strict)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path '(^|/)(\.scratch|dist|book)/'
            --root-dir ${{ github.workspace }}
            '**/*.md'
          fail: true

  # 外部链接：重试 + 排除已知易变域名 + 接受限流 429；仍然失败的才算失败。
  external-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check external links (tolerant)
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --scheme http
            --scheme https
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            --exclude-path '(^|/)(\.scratch|dist|book)/'
            --accept '200..=299,429'
            --exclude '^https?://(www\.)?(x|twitter|linkedin|facebook)\.com'
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^https?://([a-z0-9-]+\.)?example\.(com|org|net)'
            # 站点自身的 live URL 由 pages.yml 的构建校验覆盖（ch0..chA、llms*.txt 的产物存在性）。
            # link-check 与 Pages 并行运行，在此检查会与部署产生竞态，上一轮就因此误报 404。
            --exclude '^https://seasontemple\.github\.io/Venturing-into-the-Unmanned-Unknown/'
            '**/*.md'
          fail: true
