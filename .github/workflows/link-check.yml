name: Link Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 仓库内相对链接：--offline 只检查本地文件，失效即失败（真 bug，不容错）。
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check internal links (strict)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path '(^|/)(\.scratch|dist|book)/'
            --root-dir ${{ github.workspace }}
            '**/*.md'
          fail: true

  # 外部链接：重试 + 排除已知易变域名 + 接受限流 429；仍然失败的才算失败。
  external-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

        # 站点自身的 live URL 不在这里检查：它由 pages.yml 的构建校验覆盖
        # （断言 dist 里存在 ch0..chA 与 llms.txt / llms-full.txt）。
        # link-check 与 Pages 并行运行，若在此检查 live URL 会与部署竞态而误报 404。
        # 注意：args 是折叠标量，内部不要写 # 注释，否则会把整行后续参数一起注释掉。
      - name: Check external links (tolerant)
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --scheme http
            --scheme https
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            --exclude-path '(^|/)(\.scratch|dist|book)/'
            --accept '200..=299,429'
            --exclude '^https?://(www\.)?(x|twitter|linkedin|facebook)\.com'
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^https?://([a-z0-9-]+\.)?example\.(com|org|net)'
            --exclude '^https://seasontemple\.github\.io/Venturing-into-the-Unmanned-Unknown/'
            '**/*.md'
          fail: true
