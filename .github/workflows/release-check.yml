name: Release Check

on:
  push:
    tags:
      - 'v*'

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches README version mention
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF_NAME}
          echo "Tag: $TAG"
          if ! grep -q "$TAG" README.md && ! grep -qi "${TAG#v}" README.md; then
            echo "Warning: tag $TAG not mentioned in README.md (non-blocking)"
          fi
          test -f LICENSE
          test -d skills
          count=$(find skills -name SKILL.md | wc -l)
          echo "Skill count: $count"
          test "$count" -ge 9

      - name: Create source archive
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/ai-native-sdlc-guidebook-${GITHUB_REF_NAME}.tar.gz" \
            --exclude='.git' \
            .
          ls -lh dist/

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: guidebook-${{ github.ref_name }}
          path: dist/*
