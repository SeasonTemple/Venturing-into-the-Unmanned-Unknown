<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2K 宽屏阅读预览</title><style>
:root{color-scheme:dark;--ww-bg:#14252b;--ww-fg:#e5e8dc;--ww-muted:#c0cbc1;--ww-line:#536c70;--ww-active:#eeb480}*{box-sizing:border-box}body{margin:0;padding:26px clamp(20px,3vw,64px) 34px;background:var(--ww-bg);color:var(--ww-fg);font:13px/1.8 system-ui,'Microsoft YaHei',sans-serif}h1,p{margin:0}h1{font-size:26px;line-height:1.5;font-weight:500;margin:7px 0 12px}.eyebrow{font:10px/1.8 ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--ww-muted)}header>p:last-child{max-width:95ch;color:var(--ww-muted);font-size:12px}a{color:var(--ww-active);text-underline-offset:5px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:18px 30px;margin:22px 0 18px}.controls label{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ww-muted)}select{border:1px solid var(--ww-line);background:var(--ww-bg);color:var(--ww-fg);font:12px system-ui;min-height:40px;padding:7px 12px}button{font:12px system-ui;background:none;color:var(--ww-muted);border:0;border-bottom:1px solid transparent;padding:10px 1px;cursor:pointer;min-height:42px}button[aria-pressed=true]{color:var(--ww-active);border-color:var(--ww-active)}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--ww-active);outline-offset:4px}.steps{display:flex;gap:22px}.controls>a{margin-left:auto;font-size:12px}.viewport{position:relative;aspect-ratio:16/9;border:1px solid var(--ww-line);overflow:hidden;background:#f0eee7}iframe{position:absolute;inset:0;width:2560px;height:1440px;border:0;transform-origin:0 0}footer{display:flex;justify-content:space-between;gap:24px;margin-top:14px;color:var(--ww-muted);font:11px/1.8 ui-monospace,Consolas,monospace}footer a{font-family:system-ui;font-size:12px}@media(max-width:700px){.controls{gap:12px 20px}.controls>a{margin-left:0}footer{display:block}h1{font-size:23px}}
</style></head><body><header><p class="eyebrow">FIELD NOTES / 验证隘口</p><h1>沿着线索读，带着问题离开。</h1><p>探索手记的完整样张：左侧路线可跳读，页边批注对应原文，图版追问证据能保证什么。正文完整保留，新增内容标为阅读辅助。下方模拟完整视口，也可以直接打开实际阅读页。</p></header>
<div class="controls"><input type="hidden" id="layout" value="journal"><label>2K 缩放<select id="size"><option value="2560">100% · 2560 × 1440</option><option value="2048">125% · 2048 × 1152</option><option value="1707">150% · 1707 × 960</option></select></label><div class="steps"><button id="opening" aria-pressed="false">章首</button><button id="body" aria-pressed="true">分层与边界</button><button id="case" aria-pressed="false">写锁实例</button></div><a id="open-page" href="./reading.html?layout=journal&section=2" target="_blank" rel="noopener">打开实际阅读页 ↗</a></div>
<div class="viewport" id="viewport"><iframe id="preview" title="完整宽屏阅读视口"></iframe></div><footer><p id="measure" role="status">正在准备宽屏画面…</p><a href="./reading.html">打开手记，从章首开始 ↗</a></footer><script type="module">
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let view=['opening','case'].includes(params.get('view'))?params.get('view'):'body',token=0;
if(['2048','1707'].includes(params.get('size')))$('size').value=params.get('size');
const resize=()=>{$('preview').style.transform=`scale(${$('viewport').clientWidth/Number($('size').value)})`;};
function show(){const width=Number($('size').value),height=Math.round(width*9/16);$('preview').style.width=width+'px';$('preview').style.height=height+'px';$('preview').src=`./reading.html?layout=journal${view==='body'?'&section=2':view==='case'?'&section=7':''}`;$('open-page').href=$('preview').src;for(const name of ['opening','body','case'])$(name).setAttribute('aria-pressed',String(view===name));$('measure').textContent='正在准备宽屏画面…';token++;resize();}
$('preview').addEventListener('load',async()=>{const stamp=token;for(let i=0;i<100;i++){if(stamp!==token)return;if($('preview').contentWindow.__readingStudy?.ready)break;await new Promise(r=>setTimeout(r,50));}const doc=$('preview').contentDocument,content=doc.querySelector('.section-content');if(!content)return;const style=$('preview').contentWindow.getComputedStyle(content),spread=doc.querySelector('.reading-spread').getBoundingClientRect(),prose=doc.querySelector('.section-content > p')||content;$('measure').textContent=`${$('size').value} CSS px · 正文 ${style.fontSize} / ${Math.round(prose.getBoundingClientRect().width)}px · 图表 ${Math.round(content.getBoundingClientRect().width)}px · 页面展开 ${Math.round(spread.width)}px`;});
$('size').addEventListener('change',show);for(const name of ['opening','body','case'])$(name).addEventListener('click',()=>{view=name;show();});new ResizeObserver(resize).observe($('viewport'));show();
</script></body></html>
