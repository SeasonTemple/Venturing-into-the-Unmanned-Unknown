<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>七姿态 · 离散节奏预览</title>
  <style>
    :root { color-scheme: light; --paper:#ecefe4; --ink:#203d35; --muted:#64736b; --line:#b8c3b2; --accent:#d17b3d; --panel:#f7f7ef; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:var(--paper); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { width:min(1080px,calc(100% - 32px)); margin:0 auto; padding:32px 0 48px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:22px; }
    h1 { margin:0; font-size:clamp(1.5rem,3vw,2.3rem); letter-spacing:.02em; }
    header p { margin:.35rem 0 0; color:var(--muted); }
    .status { min-width:160px; padding:10px 12px; border:1px solid var(--line); background:rgba(247,247,239,.7); text-align:right; }
    .status strong { display:block; font-size:1.1rem; }
    .stage { display:grid; grid-template-columns:minmax(240px,360px) 1fr; gap:22px; align-items:start; }
    figure { margin:0; padding:18px; background:var(--panel); border:1px solid var(--line); box-shadow:0 12px 28px rgba(37,62,47,.08); }
    .actor-frame { display:grid; place-items:center; min-height:450px; background:linear-gradient(to bottom,rgba(219,229,211,.65),rgba(234,235,220,.95)); border:1px solid #d1d9cb; position:relative; }
    .actor-frame::after { content:""; position:absolute; left:12%; right:12%; bottom:18px; border-bottom:1px solid #a18f63; }
    #actor { display:block; width:260px; height:400px; image-rendering:pixelated; object-fit:contain; object-position:center bottom; position:relative; z-index:1; }
    figcaption { display:flex; justify-content:space-between; gap:16px; margin-top:12px; color:var(--muted); }
    figcaption strong { color:var(--ink); }
    .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px; background:rgba(247,247,239,.75); border:1px solid var(--line); }
    button, select { min-height:40px; border:1px solid #819287; border-radius:5px; background:#f7f7ef; color:var(--ink); font:inherit; padding:8px 12px; cursor:pointer; }
    button:hover, select:hover { border-color:var(--accent); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent); outline-offset:2px; }
    button[aria-pressed="true"] { background:#dce6d8; border-color:var(--ink); }
    label { color:var(--muted); }
    input[type="range"] { width:min(260px,100%); accent-color:var(--accent); }
    .timeline { display:grid; grid-template-columns:repeat(7,minmax(74px,1fr)); gap:8px; margin-top:14px; }
    .timeline button { min-height:74px; padding:8px; text-align:left; }
    .timeline button[aria-current="step"] { border-color:var(--accent); box-shadow:inset 0 -3px 0 var(--accent); }
    .timeline small { display:block; color:var(--muted); }
    .notes { margin-top:18px; padding:14px 16px; border-left:3px solid var(--accent); background:rgba(247,247,239,.65); color:var(--muted); }
    .notes p { margin:.25rem 0; }
    @media (max-width:760px) { main { width:min(100% - 20px,620px); padding-top:20px; } header { display:block; } .status { margin-top:14px; text-align:left; } .stage { grid-template-columns:1fr; } .actor-frame { min-height:390px; } #actor { width:220px; height:338px; } .timeline { grid-template-columns:repeat(4,minmax(72px,1fr)); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition-duration:0.01ms !important; animation-duration:0.01ms !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>七姿态 · 离散节奏预览</h1>
        <p>一次负重换步，用于检查脚底、重心和装备随身关系。</p>
      </div>
      <div class="status" aria-live="polite"><strong id="phase">01 · 右脚承重</strong><span id="statusText">已暂停 · 静帧审片</span></div>
    </header>
    <section class="stage" aria-labelledby="preview-title">
      <figure>
        <div class="actor-frame"><img id="actor" src="right-support.png" width="260" height="400" alt="橙色夹克工务人员，右脚承重的像素人物姿态"></div>
        <figcaption><strong id="caption">右脚承重</strong><span id="counter">1 / 7</span></figcaption>
      </figure>
      <div>
        <h2 id="preview-title">逐帧查看</h2>
        <div class="controls" aria-label="播放控制">
          <button id="play" type="button" aria-pressed="false">播放</button>
          <button id="prev" type="button">上一帧</button>
          <button id="next" type="button">下一帧</button>
          <label for="speed">速度</label>
          <select id="speed" aria-label="播放速度">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
          </select>
          <label for="frame">帧位</label>
          <input id="frame" type="range" min="0" max="6" value="0" step="1" aria-label="选择帧位">
        </div>
        <div class="timeline" aria-label="七个姿态">
          <button type="button" data-frame="0" aria-current="step">01<small>右承重</small></button>
          <button type="button" data-frame="1">02<small>左腿经过</small></button>
          <button type="button" data-frame="2">03<small>左脚前摆</small></button>
          <button type="button" data-frame="3">04<small>左脚跟下落</small></button>
          <button type="button" data-frame="4">05<small>低位接触</small></button>
          <button type="button" data-frame="5">06<small>右腿经过</small></button>
          <button type="button" data-frame="6">07<small>左承重</small></button>
        </div>
        <div class="notes">
          <p>播放到第 7 帧会停下，不循环，不倒播，不补绘中间帧。</p>
          <p>如果接触段读成“突然滑步”，应回到整帧重排，而不是用速度或插值掩盖。</p>
        </div>
      </div>
    </section>
  </main>
  <script>
    const frames = [
      { file:'right-support.png', title:'01 · 右脚承重', short:'右脚承重', alt:'右脚全掌承重，左脚前摆接触' },
      { file:'right-through.png', title:'02 · 右承重 · 左腿经过', short:'左腿经过', alt:'右脚承重，左腿抬离经过' },
      { file:'left-passing.png', title:'03 · 左脚前摆', short:'左脚前摆', alt:'右脚支撑，左脚向前摆动' },
      { file:'left-touchdown.png', title:'04 · 左脚跟下落', short:'左脚跟下落', alt:'右脚仍支撑，左脚跟下落' },
      { file:'left-contact.png', title:'05 · 左脚低位接触', short:'低位接触', alt:'右脚支撑，左脚低位接触' },
      { file:'left-through.png', title:'06 · 左承重 · 右腿经过', short:'右腿经过', alt:'左脚承重，右腿抬离经过' },
      { file:'left-support.png', title:'07 · 左脚承重', short:'左脚承重', alt:'左脚全掌承重，右脚离地' }
    ];
    const durations = [150, 120, 105, 145, 150, 120, 180];
    const actor = document.querySelector('#actor');
    const phase = document.querySelector('#phase');
    const caption = document.querySelector('#caption');
    const counter = document.querySelector('#counter');
    const statusText = document.querySelector('#statusText');
    const play = document.querySelector('#play');
    const frameInput = document.querySelector('#frame');
    const timelineButtons = [...document.querySelectorAll('[data-frame]')];
    let index = 0;
    let timer = 0;
    let playing = false;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const render = (nextIndex) => {
      index = Math.max(0, Math.min(frames.length - 1, nextIndex));
      const frame = frames[index];
      actor.src = frame.file;
      actor.alt = `像素人物：${frame.alt}`;
      phase.textContent = frame.title;
      caption.textContent = frame.short;
      counter.textContent = `${index + 1} / ${frames.length}`;
      frameInput.value = String(index);
      timelineButtons.forEach((button) => button.setAttribute('aria-current', Number(button.dataset.frame) === index ? 'step' : 'false'));
    };
    const stop = (message = '已暂停 · 静帧审片') => {
      playing = false;
      window.clearTimeout(timer);
      play.setAttribute('aria-pressed', 'false');
      play.textContent = '播放';
      statusText.textContent = message;
    };
    const tick = () => {
      if (!playing) return;
      if (index >= frames.length - 1) { stop('已到末帧 · 静帧审片'); return; }
      render(index + 1);
      timer = window.setTimeout(tick, durations[index] / Number(document.querySelector('#speed').value));
    };
    play.addEventListener('click', () => {
      if (playing) { stop(); return; }
      if (index >= frames.length - 1) render(0);
      playing = true;
      play.setAttribute('aria-pressed', 'true');
      play.textContent = '暂停';
      statusText.textContent = '播放中 · 一次换重';
      timer = window.setTimeout(tick, durations[index] / Number(document.querySelector('#speed').value));
    });
    document.querySelector('#prev').addEventListener('click', () => { stop(); render(index - 1); });
    document.querySelector('#next').addEventListener('click', () => { stop(); render(index + 1); });
    document.querySelector('#speed').addEventListener('change', () => { if (playing) { window.clearTimeout(timer); timer = window.setTimeout(tick, durations[index] / Number(document.querySelector('#speed').value)); } });
    frameInput.addEventListener('input', () => { stop(); render(Number(frameInput.value)); });
    timelineButtons.forEach((button) => button.addEventListener('click', () => { stop(); render(Number(button.dataset.frame)); }));
    document.addEventListener('visibilitychange', () => { if (document.hidden && playing) stop('页面隐藏 · 已暂停'); });
    if (reduced) statusText.textContent = '已暂停 · 已尊重减少动态设置';
    render(0);
  </script>
</body>
</html>
