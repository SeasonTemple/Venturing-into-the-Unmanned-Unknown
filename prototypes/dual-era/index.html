<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>迈向无人区 · 双时代探索原型</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"/deps/three/build/three.module.js","three/addons/":"/deps/three/examples/jsm/"}}</script>
</head>
<body>
  <header class="site-header"><a href="/" class="brand">迈向无人区</a><span class="eyebrow">迈入未知 · 测绘前哨</span><a href="https://github.com/SeasonTemple/Venturing-into-the-Unmanned-Unknown" target="_blank" rel="noopener">GitHub ↗</a></header>
  <main>
    <section id="entry-status" class="entry-status" aria-labelledby="entry-title">
      <p class="eyebrow">迈入未知</p><h1 id="entry-title">正在进入测绘前哨</h1><p id="load-status" role="status">正在准备空间…</p>
      <div class="buttons"><button id="retry-entry" class="primary" hidden>再次进入</button><a href="/">返回首页</a></div>
    </section>
    <section id="experience" hidden aria-label="测绘前哨探索">
      <div class="experience-header"><div><p class="eyebrow" id="mode-label"></p><h1>恢复测绘中继网络</h1></div><div class="experience-options"><fieldset id="mode-switch" class="mode-switch"><legend>探索方式</legend><label><input type="radio" name="exploration-mode" value="human">人类主导</label><label><input type="radio" name="exploration-mode" value="agent" checked>AI 原生</label></fieldset><a id="exit" class="button" href="/#explore-entry">返回首页</a></div></div>
      <div class="scene-layout">
        <div class="world-column">
          <div id="world" class="world-viewport" aria-label="三维测绘前哨"><div id="canvas-host"></div><div id="scene-labels" class="scene-labels"><button class="scene-tag" data-node="source">源端</button><button class="scene-tag" data-node="relay">中继</button><button class="scene-tag" data-node="verify">检查装置</button><button class="scene-tag" data-node="receiver">接收端</button><button class="scene-tag" data-node="console">意图台</button></div><p id="world-status" class="world-status" role="status">正在准备空间…</p><span class="unknown-label">边界之外，仍有未知</span><div class="view-controls"><button id="overview">空间总览</button><button id="follow">跟随工作现场</button></div></div>
          <div class="world-legend"><span>实线：已接入</span><span>断线：候选／待证据</span><span>×：检查发现问题</span></div>
          <div class="method-strip"><div><span class="eyebrow">发现的方法 / CH 03</span><strong id="method-title">验证</strong><span class="note">怎样把“看起来可用”变成有范围的证据？</span></div><button id="read-chapter">展开章节与检查方法 →</button></div>
        </div>
        <aside class="task-panel" aria-labelledby="task-heading">
          <p class="eyebrow" id="phase-label">任务</p><h2 id="task-heading">当前职责</h2><p id="responsibility"></p><p class="task-message" id="task-message" role="status" aria-live="polite"></p>
          <fieldset id="harness-controls" hidden><legend>委派时使用的检查门禁</legend><div id="check-options"></div><small>未配置的条件不会自动获得证据。</small></fieldset>
          <div id="actions" class="task-actions"></div>
          <section aria-labelledby="evidence-title"><div class="evidence-head"><h3 id="evidence-title">当前验收证据</h3><span id="revision" class="eyebrow"></span></div><ul id="evidence" class="evidence-list"></ul></section>
          <details><summary>查看可追踪记录</summary><ol id="history" class="history"></ol></details><button id="reset" class="quiet">重置当前职责的任务</button>
        </aside>
      </div>
    </section>
  </main>
  <dialog id="reader" aria-labelledby="reader-title"><div class="reader-header"><div><p class="eyebrow">工作站阅读面</p><h2 id="reader-title">第 3 章 · 验证</h2></div><button id="close-reader">关闭阅读，返回原处</button></div><div class="reader-tools"><button id="apply-method" class="primary">将方法加入当前检查清单</button><a id="canonical-chapter" target="_blank" rel="noopener">普通阅读页 ↗</a></div><p class="note">应用方法不会直接判定任务通过，仍须运行检查取得证据。</p><article id="chapter-content" class="chapter-content" aria-busy="false"></article></dialog>
  <script type="module" src="./app.mjs"></script>
</body></html>
